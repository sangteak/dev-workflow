# intake-routing — 확정 시드
# 국면 2~4의 변경분을 반영한 최종본. PLAN 단계와 문서 취합의 참조 자료.

# REQ-006 선반영 — 갈래 칸. 이 설계가 만드는 규격을 자기 시드에 먼저 적용한다.
action: new-feature

goal: "일이 들어오는 문을 브레인스토밍 하나로 모으고, 요청의 성격(신규 기능·사양 변경·리팩터링·결함)에 따라 나가는 문과 남기는 것을 다르게 한다."

constraints:
  - "단계 이름 다섯(BRAINSTORM·PLAN·DEVELOP·REVIEW·COMPLETION)을 늘리지 않는다 — 새 갈래 하나당 손댈 곳이 12~16군데가 되고 사용자 규칙 파일에까지 이름이 새겨진다"
  - "superpowers 내부 절차를 바꾸지 않는다 — 더 나은 입력을 건네는 것까지가 우리 몫"
  - "상시 주입에 바이트 목표를 세우지 않는다 — plugin-architecture.md:48 「수치 프록시 금지」가 이미 규범이고, :50은 상시 린트로 승격하지 않는다고 못 박는다. 순증은 '전량 분류'로 다룬다 (구 '2,560바이트 예산 26.6% 초과'는 실측된 적 없는 숫자로 판명되어 철회)"
  - "'버그는 묻지 말고 그냥 고쳐라'가 development-principles/SKILL.md:42와 사용자 전역 설정 두 곳에 있고, 후자는 이 저장소가 못 고친다"
  - "하위 에이전트는 격리 컨텍스트로 시작해 세션 시작 훅 주입을 보지 못한다"
  - "스킬 문서를 검사하는 자동 테스트가 하나도 없다 (테스트 17건은 전부 훅 겨냥)"
  - "실제로 도는 것은 워크트리가 아니라 캐시 사본 — 확인하려면 버전 범프·재설치·재시작"
  - "안전장치를 빼는 방향의 경량화는 하지 않는다"

non_goals:
  - "단계 이름을 갈래별로 늘리기 (DEBUG·REFACTOR 신설)"
  - "브레인스토밍 앞에 별도 문진 화면 두기 — 문이 둘이 되고 발동 경쟁자가 는다"
  - "새 통합 입구 스킬 만들기 — 되돌리기 어렵고 이름을 직접 부른 사람에게도 통행세"
  - "아카이브 누적 관리 규칙 만들기 — _archive/는 이미 세션 목록과 머지 스캔에서 빠진다"
  - "관측 루프 만들기 — 사용자 기각. 기존 관측 루프 3건이 이미 미실행 방치 상태"
  - "superpowers systematic-debugging 내부 4단계 수정"

success_criteria:
  - "결함 발화('~가 안 나와', '문제 확인해줘')에 dev-workflow가 발동하고, 디버깅 스킬로 넘어가기 전에 질문 다섯 칸이 채워진다"
  - "네 갈래 모두 다섯 단계를 전부 지나되, 각 단계에서 확정하는 항목 수가 갈래마다 다르다"
  - "새 행동 하나를 추가할 때 actions.md에 블록 하나만 더하면 되고 단계 표·발동 규칙·화면 문법을 건드리지 않는다"
  - "결함 마무리에서 폴더가 지워지되, 지우기 직전 확인 화면이 뜬다"
  - "갈래 값이 설계 문서 앞머리·HANDOFF.md·seed.yaml 세 곳에 살아 있어 세션이 끊겨도 복구된다"
  - "건너뛸 수 없는 바닥 여섯이 어떤 갈래에서도 실행된다"

assumptions:
  - "[미검증] 사용자가 성격 승인 화면에서 갈래를 제대로 고른다 — 틀리는 빈도는 써 봐야 안다"
  - "[미검증] 결함이 마무리에 닿을 무렵의 사용자는 그것이 결함이었는지 사양 변경이었는지 안다 — 삭제 확인 게이트가 이 가정 위에 선다"
  - "[미검증] 브레인스토밍이 넘긴 다섯 칸이 디버깅 1단계의 요구를 실제로 만족시킨다 — 이름은 맞췄다"
  - "[반박 기록] 전문가 셋이 독립적으로 '원래 목적은 질문 게이트 하나로 풀린다'에 도달했다. 이 설계가 서는 자리는 '사용자가 자기 요청의 종류를 스스로 판단하기 어려울 때'로 좁다"

open_questions:
  # 검증 승계·감사 미다룸·표기 15건은 2026-08-06 계획 단계에서 전부 확정됐다.
  # 확정 내용은 intake-routing.md §8 「계획 단계 확정 (15건)」 참조.
  # 남은 것은 원래부터 '구현 중 관찰로 정한다'고 합의된 넷 + 계획에서 새로 드러난 하나.

  # 계획 단계에서 새로 드러남 (1)
  - "캐시 사본 문제 — 마켓플레이스 소스가 D: 드라이브 main 체크아웃이고 현재 브랜치가 대상 스킬 3곳을 건드린 커밋 하나만큼 앞서 있다. 라이브 확인 절차를 계획에서 정해야 한다"

  # 구현 중 관찰 (4)
  - "발동 어휘 최초 세트 — 후보 15개. '안 돼'는 오탐 1순위, 완곡 표현은 일부러 제외"
  - "리팩터링이 계획 단계를 항상 거치는가, 파일 수 기준 조건부인가"
  - "결함에서 '고칠 파일 4개 이상이면 갈래를 벗어난다'의 숫자 4 — 선례 없는 임의값"
  - "이의 창의 길이 — '다음 국면의 첫 사용자 응답까지'는 임의값"

context: |
  사용자가 겪은 문제는 하나였다 — "무슨 문제가 생겼어 했더니 dev-workflow가 호출되지 않고
  바로 superpowers:debugger가 호출됐어. 이게 싫었던거야."

  조사 결과 bootstrap.md:8의 발동 어휘에 결함 계열이 없고, 반대편에는 using-superpowers:31의
  명시적 배선("Fix this bug" → systematic-debugging first)이 있다. 그 스킬의 1·2단계에는
  사람에게 묻는 절차가 아예 없다.

  주문을 외워 브레인스토밍을 켜도 해결되지 않는다 — 첫 화면이 카테고리 확정이고,
  끝나면 무조건 계획으로 가며, 문서 다섯 개가 생긴다. 결함에 맞지 않는 옷이다.

  설계의 뼈대는 축을 하나 더 놓되 기존 축을 건드리지 않는 것이다.
  단계 축(언제)은 그대로 두고, 갈래 축(무엇을 확정해야 끝인가·어디로 넘기는가·무엇을 남기는가)을
  문서 앞머리 action: 한 줄로 병기한다. 모든 갈래가 다섯 단계를 전부 지나고 깊이만 다르다.

  선행 시도 _archive/debug-narrowing/은 디버깅 앞에 별도 구간을 두는 설계였다.
  사용자가 원한 것은 입구 통일과 출구 분기였음이 드러나 중단하고 확인 사실을 승계했다.

  검증에서 전문가 셋이 서로를 못 본 채 "원래 목적은 질문 게이트 하나로 풀린다"에 도달했고,
  "전제가 틀렸을 때 잃는 것은 작고 전제를 믿고 지불하는 값은 크다"는 비대칭을 지적했다.
  사용자는 이를 알고 진행을 택했으며, 되돌릴 수 없는 위험(폴더 삭제) 하나만
  확인 게이트로 막기로 했다.
