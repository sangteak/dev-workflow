# 작업 방향 (사본 — 정본은 perforce-search-ignore.md 앞머리. actions.md 「정본 규정」 참조)
action: new-feature
goal: "Perforce 저장소에서 사용자가 직접 부르는 dev-workflow 명령 하나로, 세션 폴더의 .p4ignore 폴더 줄을 후보로 확인받아 .claude/ignore.yaml(system 부분과 user 부분)에 기록하고, 그 yaml에서 .ignore를 만들어 Claude Code Grep 검색에서 빌드 산출물 폴더를 뺀다"
constraints:
  - "명시 호출 명령 /dev-workflow:search-ignore — 기본 설치, 자동 생성, 세션 시작 훅 알림 없음"
  - "세션 폴더에 .p4ignore(없으면 p4ignore.txt)가 있을 때만 동작, 위로 올라가며 찾지 않음, git 검사와 p4 조회 없음"
  - "생성은 플러그인 안 Node 스크립트(yaml 라이브러리 esbuild 번들, --target=node18, 머지 MCP와 따로), Bash 도구로 두 번 호출(plan, apply)"
  - ".ignore 줄은 .p4ignore에서 고른 줄과 user 부분 줄을 그대로 옮김 — **/ 추가나 모양 변경 없음"
  - "원본 .claude/ignore.yaml: system 구획(명령 소유, 시작 표지와 끝 표지), user 부분(사람 소유), 키 exclude 하나"
  - ".ignore 머리 주석 3줄(소유 표지, 경고와 고치는 길, source), 시각과 해시 없음, 소유 표지 없는 기존 .ignore면 멈춤"
  - "생성 뒤 세션 폴더에서 pattern만 준 Grep으로 모양별 대표 파일 확인 — 통과, 실패(원인 후보), 확인 못 함. 실패해도 파일은 남김"
  - "Node.js 18+ 필요 — 첫 호출 실패 시 멈춤과 setup 안내, 모델 대체 생성 없음"
  - "명령은 설정 파일(settings.local.json 등)을 고치지 않음"
  - "기성 검색 도구를 추천하거나 안내하지 않음"
non_goals:
  - "git 저장소 지원"
  - "제출 처리 (알림만: p4 reconcile에 새 파일로 잡힘)"
  - "루트 탐색, P4IGNORE 다른 이름, 하위 폴더 .p4ignore"
  - "Glob 도구 설정 자동 변경 (안내만)"
  - "permissions.deny 사용 (Read까지 막고 최선 노력)"
  - "다음 버전: 세션 시작 훅 알림, 이 저장소에서는 쓰지 않음 선택지, keep(안쪽 되살리기), 본문 해시 비교, ! 줄 알림, 도구 폴더 안내 문구, 미리 체크 행의 이유"
success_criteria:
  - "GW 세션 폴더에서 명령을 실행하면 .ignore와 .claude/ignore.yaml이 생기고, 루트 Grep 결과에서 Intermediate 안 파일이 0건이 된다 (실측 기준: 337파일 중 161파일 제외)"
  - "같은 입력으로 두 번 실행하면 두 파일이 바이트 단위로 같다"
  - "user 부분에 줄을 더하고 다시 실행하면 system 구획만 다시 쓰이고 user 부분 주석과 줄은 그대로다"
  - "소유 표지 없는 .ignore, .p4ignore 없는 세션 폴더, Node 없음에서 파일을 바꾸지 않고 다음 할 일을 알리며 멈춘다"
  - "명령 끝 Grep 확인이 통과, 실패, 확인 못 함 중 하나를 보고한다"
assumptions:
  - "Claude Code Grep 도구가 git 밖에서도 세션 폴더의 .ignore를 지킨다 (실측, 공식 문서에는 없음)"
  - "사용자는 .p4ignore가 있는 폴더에서 세션을 연다"
open_questions:
  - "생성 스크립트와 번들을 둘 자리 (scripts/는 배포 대상 아님) — PLAN에서"
  - "파일 종류를 지정하지 않은 GW 루트 검색이 .ignore가 있어도 172, 174파일로 흔들린 원인"
context: "GW(UE5 C++, Perforce)는 C++ 파일 56,745개 중 86%가 Intermediate 생성 코드이고, Perforce에는 .gitignore가 없어 Grep이 산출물을 훑는다. 산출물 목록은 .p4ignore에 이미 있으므로 이를 .ignore로 옮긴다. 국면 1~3 결정: phase1_exploration.md, phase2_discovery.md, phase3_validation.md (뒤 국면이 우선)"
