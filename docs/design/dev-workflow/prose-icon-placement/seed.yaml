# 작업 방향 (사본 — 정본은 prose-icon-placement.md 앞머리)
action: spec-change
goal: >
  사용자 대면 화면의 설명 문장이 막힘없이 읽히게 한다. 아이콘은 줄 첫머리(이름표, 불릿 머리,
  판정 이름표)의 강조로만 쓰고 설명 문장 안에서 낱말을 대신하지 않는다. 문장 속에서 아이콘
  자체를 가리킬 때는 백틱으로 감싼다. 조사 결과 화면의 이름표 되풀이를 템플릿 모양으로 없애고,
  이어 쓰던 세션에 옛 화면이 남아 있어도 새 규범이 이기게 한다.

constraints:
  - 규칙은 decision-flow.md 3부 언어 규범 펜스에 둔다 (실행 시점 복제, 문서 사본 없음)
  - 상시 주입본 bootstrap.md는 이번에 늘리지 않는다
  - 판정 이름표와 확인 아이콘의 뜻과 자리는 그대로 둔다
  - 검증 규범의 이름표 문장은 고치지 않는다 — 템플릿 모양만 고친다
  - 규범 정본 자신이 백틱 대상을 갖고 있어 규칙과 스윕을 같은 커밋에 묶는다
  - 도착 검사가 규범 문자열을 리터럴로 대조하므로 스윕과 같은 커밋에서 고친다
  - 도메인 문서와 feature 문서 평문에 불릿을 쓰지 않는다
  - 커밋과 푸시는 마무리 절차에서만, 버전은 scripts/bump-version으로만

non_goals:
  - 확인 아이콘과 판정 아이콘의 뜻 겹침을 푸는 것
  - 제목, 항목 머리, 판정 이름표, 확인 아이콘 자리의 아이콘을 줄이는 것
  - 확인 아이콘의 뜻이나 근거 첨부 의무나 증거 구획 구조를 바꾸는 것
  - 1.28.0이 걷어낸 출처 문자열과 인용을 되돌리는 것
  - Feasibility 판정 기준 자체를 바꾸는 것
  - 결정 박스 설명 블록에 분량 상한을 두는 것
  - 판정 발언을 두 줄로 나누는 것 (화면 40퍼센트 증가)
  - 상시 주입본 요약 줄에 아이콘 조항을 더하는 것 (후속)

success_criteria:
  - 설명 문장 안에 아이콘이 낱말 대신 들어가지 않는다 — 판정은 낱말로, 확인 상태도 낱말로
  - 줄 첫머리와 이름표의 아이콘은 남아 화면 구성이 한눈에 보인다
  - 문장 속에서 아이콘 자체를 가리킬 때 백틱으로 감싸져 있다
  - 조사 결과 화면에서 이름표가 항목당 한 번만 나오고 불릿에는 아이콘이 없다
  - 판정 발언이 한 줄이고 낱말이 병기되며 대괄호 태그가 없다
  - transcript-sources.mjs가 백틱 없는 맨몸 아이콘과 조사를 세고 종료 코드에 반영한다
  - 이름표 되풀이는 숫자로 보고된다 (종료 코드 제외)
  - test-restatements.sh의 도착과 잔존 검사 통과, 도착 검사 리터럴이 백틱 스윕과 맞는다
  - 새 세션과 이어 쓰기 세션에서 증상 셋이 재현되지 않는다
  - 최종 판정은 사용자가 화면을 읽고 막힘이 없다고 말하는 것

assumptions:
  - 옛 태그 재발의 주된 원인은 이어 쓰던 세션에 남은 옛 화면이다
  - 언어 규범 펜스의 규칙은 워커 복제로 전파된다
  - 실사용 확인은 사용자가 수행한다
  - 백틱 대상은 실측 13건 9행 3파일이고 구현 시작 때 다시 센다

open_questions:
  - 백틱이 터미널에서 어떻게 보이는지 (실사용 확인에서 눈으로)
  - 규범 정본 351행의 아이콘 둘 중 어느 쪽까지 백틱을 씌울지 (구현 시작 때)
  - 이름표 되풀이 정규식의 오탐 잔량 (첫 실사용에서 표본 수집)

context: >
  문서 기반 Claude Code 플러그인. 직전 릴리스 1.28.0(grounded-output-display)의 실사용에서
  증상 셋이 나왔다 — 판정 발언의 옛 대괄호 태그, 조사 결과 화면의 이름표 되풀이,
  결정 박스 산문의 아이콘 낱말 대체. 설치 사본에는 옛 모양이 0건이라 워커가 규범에서
  베낀 것은 아니고, 이어 쓰던 세션의 옛 화면이 유력한 원인이다.
  국면 1 결정: 아이콘 거부 범위, 완료 기준, 화면의 경계, 이름표 되풀이의 뿌리.
  국면 2 결정: 백틱으로 가르기, Simplifier 일부 수용.
  국면 3 재협의: 판정 발언 한 줄 유지, 이름표 되풀이는 보고만.
