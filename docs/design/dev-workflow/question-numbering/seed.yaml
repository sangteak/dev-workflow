# 작업 방향 (사본 — 정본은 question-numbering.md 앞머리)
action: spec-change
goal: "질문을 내보내기 전에 세는 술어를 「답의 후보를 셀 수 있는가」에서 「답의 후보를 적어 본다」로 바꾸고, 개방형 기본값과 검사 면제가 서로를 면제하던 두 조항을 함께 걷어내, 답의 후보가 닫힌 질문이 번호 선택지 없이 나가는 재발을 막는다"
constraints:
  - "범위는 질문 트랙만 — 흔적이 안 남는 다른 판정 단계 전반은 대상이 아니다"
  - "세는 단계는 조건 없이 항상 돈다 — 먼저 통과해야 할 판단 관문을 두지 않는다"
  - "조항 수를 늘리지 않는다 — 있는 문장을 고쳐 쓰고 하나를 지운다. PLAN 재협의로 검사 스크립트 하나가 새로 들어왔으나 이는 조항이 아니라 도구다"
  - "규범을 고치면 재서술 지점 목록에 따라 복제된 자리를 같은 차례에 고친다"
  - "훅이나 MCP 도구로 강제하지 않는다"
  - "agent-roles.md는 문장 수정 금지 사본이라 손대지 않는다 — 칸은 감싸는 프롬프트 쪽에 둔다"
  - "커밋과 푸시는 마무리 시퀀스에서만, 각각 따로 확인받는다"
non_goals:
  - "흔적이 안 남는 판정 단계 전반 (조립 전 조건·내보내기 전 검사·적용 등급 판정)"
  - "질문 문장의 어미를 보는 검사"
  - "개방형 질문에 근거 줄 붙이기"
  - "마무리 시퀀스의 상시 관측 조항"
  - "복제를 원본 가리키는 한 줄로 줄이는 정리"
  - "결정 화면과 질문 화면의 형식 통합"
  - "design-summary 범위 질문 화면 신설 (별도 feature로 분리)"
  - "도메인 문서의 규범 서술 본문 교체 (도메인 머지 대기)"
  - "「답의 후보」 칸이 비어 왔을 때의 반려 경로"
  - "SemVer 관행과 CLAUDE.md 표의 어긋남 정리"
success_criteria:
  - "옛 술어가 skills 아래에서 0건 (docs는 phase 스냅샷 인용분만 남는다)"
  - "440번째 줄 기본값이 뒤집히고, 427번째 줄 적용 밖 목록에서 두 번째 항목이 빠져 목록이 셋이 된다"
  - "검사 1번과 2번의 대상 서술에 '선택지가 붙은 질문'이 적힌다 — 검사 1번에는 「적용 자리」 줄이 없어 기존 대상 서술 줄을 고쳐 쓴다"
  - "templates.md의 프롬프트 펜스에 「답의 후보」 칸이 생기고 출력 형식 펜스에는 안 들어간다"
  - "탐색적 질문에 0번 탈출구가 늘 붙는다"
  - "산문 닫힌 질문 네 자리가 번호 화면이 되고, Yes/No 게이트 형식 정의 둘도 결과 줄을 요구한다"
  - "도메인 문서 두 파일의 v1.25.0 딱지 열다섯 곳이 v1.24.1로 바뀐다"
  - "질문 출력 형식 펜스 둘에 조건부 번호 선택지 줄이 들어간다 — 지금 0건"
  - "bootstrap.md 세션 불변식 줄에 질문 규칙이 들어간다 — 지금 0건"
  - "재서술 목록을 세는 검사 스크립트가 tests 실행 목록에 들어가고 이번 통과 확인에서 실제로 돈다"
  - "언어 규범의 즉석 풀이 대상과 내보내기 전 검사 1번의 대상이 식별자까지 넓어진다"
  - "scripts/bump-version --check 통과 (1.26.0), tests/hooks/run-all.sh 회귀 없음"
  - "main 머지 뒤 새 세션에서 브레인스토밍 1회 재현 — 확인한 버전·질문 수·번호 붙은 수·개방형 수·후보 칸이 채워져 온 수·그 세션에서 templates.md와 decision-flow.md가 열렸는가를 설계 문서 9번 절에 기록"
  - "tasks/lessons.md에 재발 원인과 남는 한계 기록"
assumptions:
  - "「세는 단계를 경로에 박으면 지켜진다」는 처방 형태가 유효하다 — 한 번 반증됐고 술어를 바꿔 다시 건다"
  - "읽히지 않은 것이 원인의 일부다 — 다섯 사본이 문자 그대로 같았는데도 안 돌았고, 상시 주입되는 bootstrap.md에는 질문 규칙이 0건이었다"
  - "반환물에 남는 것과 화면에 나가는 것 사이에 다리가 필요하다 — 출력 형식 펜스의 번호 줄이 그 다리다"
  - "본체가 직접 쓴 개방형 질문은 후보를 적어 봤는지가 화면에 안 남는다 — 페르소나 경로에도 후보가 한 줄 이하면 같은 한계가 걸린다"
  - "한 세션의 재현으로는 번호가 붙은 이유가 새 규범인지 그 세션 질문이 원래 닫혀 있어서인지 못 가른다"
  - "디렉토리 마켓플레이스가 저장소를 그때그때 읽는지 캐시로 복사한 뒤 읽는지 확정하지 못했다 — 그래서 재현 전에 버전을 확인한다"
  - "Superpowers의 면제 조항 실측은 디스패치 프롬프트 문구 대조였지 규범 문서 구조가 아니다"
open_questions: []
context: "dev-workflow 플러그인의 규범 문서에 '답의 후보를 셀 수 있으면 번호를 붙인다'가 다섯 곳에 적혀 있었는데도 닫힌 질문이 개방형으로 나갔다. 같은 지적이 두 번째이고, 첫 대응(조립 전 갈림 신설, v1.24.2)이 막지 못했다. 술어가 판정하는 쪽 자신의 능력을 묻는 표현이었던 것과, 개방형 기본값 조항이 그 판정을 검사에서 빼 주던 것이 원인이다."
