# 작업 방향 (사본 — 정본은 middle-dot-removal.md 앞머리)
action: spec-change
goal: "모델이 읽는 모든 글과 docs/design의 도메인 문서와 설계 문서에서 가운뎃점(·) 나열을 없애, 화면에 점으로 이은 문장이 더는 나오지 않게 한다. 규칙 한 줄이 아니라 스윕과 상시 잔존 검사가 실체다"
constraints:
  - "가운뎃점은 이름 문구 가운뎃점(·) 한 자리에만 남는다"
  - "문장 안 나열은 쉼표와 와/과(마지막 한 번), 또는 뜻이면 나/이나, 층이 있으면 줄을 나눠 불릿, 표 칸과 한 줄 표시는 쉼표, 항목 안 쉼표는 어순 재배치, 따옴표 항목은 층이 아님"
  - "꼬리표는 앞은 쉼표 마지막만 와/과"
  - "규범 줄에 올바른 예시 하나, bootstrap은 조각만, 내보내기 전 검사 여섯째 항목"
  - "스윕은 포함 목록 아홉, 면제는 phase 파일과 _archive와 evidence 경로 셋뿐"
  - "워커 허용 연산 셋, 낱말 불변, 치환 고정표, 도메인 문서 평문은 불릿 금지, Edit만"
  - "잔존 헬퍼는 문구 제거 후 0건, 바이트 패턴, 도착 검사 셋, sweep 범위 불변"
  - "대조 스크립트와 transcript 스크립트는 node"
  - "버전 1.27.2는 scripts/bump-version으로만"
non_goals:
  - "svg 그림과 mcp 소스 주석"
  - "phase 파일, _archive, evidence 수정"
  - "다른 문장부호 규범"
  - "재생성 루프나 훅 신설, 절대 안 나온다는 보장"
  - "도메인 머지와 푸시"
success_criteria:
