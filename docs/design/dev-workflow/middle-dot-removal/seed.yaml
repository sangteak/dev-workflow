  - "실사용 한 바퀴는 앞선 릴리스 넷 확인과 같은 바퀴"
  - "실측 1,418개는 스윕 시작 때 재실측"
open_questions: []
context: "화면 문장이 스크립트, 시나리오, 설계 문서 세 파일을 점으로 이어 읽기 불편하다는 사용자 지적. 원인은 규범 문서 자체의 문체 흉내"
