goal: "superpowers가 실제 디버깅을 그대로 전담하되, 전달되는 결함 내용이 구체적이지 않을 때 파악 범위를 좁히기 위한 간단한 브레인스토밍을 superpowers 디버깅 진입 전에 한 구간 둔다. 이 구간은 질문으로 증상을 좁히고 미처 생각 못 한 가능성을 표면으로 끌어내며, 결과는 일회성이므로 어디에도 기록하지 않는다."

constraints:
  - "superpowers 디버깅 네 단계는 손대지 않는다. 조사부터 고치기까지 그쪽이 전담한다"
  - "새로 만드는 것은 디버깅 진입 전 구간 하나뿐이다. 사용자 원문의 표현대로 간단한 규모를 유지하며, 왕복 수와 대기 시간이 늘면 이 구간부터 줄인다"
  - "좁히기의 끝점은 증상 명세와 조사 우선순위까지다. 원인은 지목하지 않는다"
  - "조사 우선순위는 명령이 아니라 권고다. 여기서 증거가 안 나오면 이 순서를 버리고 원점에서 다시 보라는 복귀 문장을 함께 넘긴다"
  - "어떤 파일도 만들지 않는다. 오래 남는 기록은 실패 테스트와 커밋이 맡는다. 파일 미생성을 상태 보존 규범의 예외로 한 줄 명시한다"
  - "원인이 이미 분명한 결함은 좁히기 없이 그냥 고친다"
  - "개발 단계가 진행 중일 때는 이 구간이 발동하지 않는다. 판정은 계획 파일의 존재가 아니라 신고된 결함이 열린 계획의 태스크 범위 안인가로 한다"
  - "되돌아가는 문을 두 개 둔다. 고치는 방법이 여러 갈래면 사양 결정으로, 설계 자체가 문제면 기능 승계로. 자동 분기 장치는 만들지 않고 안내 한 줄과 사람의 수동 전환으로 한다"
  - "비판에 참여할 전문가는 프로젝트 고정 세트를 쓴다. 세트 파일이 없으면 비판 라운드를 통째로 생략한다"
  - "발동 경로는 두 개다. bootstrap 발동 규칙에 한 줄 추가와 슬래시 명령을 병행한다. 처음 어휘는 최소한으로 시작하고 실제 발동을 보며 늘린다"
  - "발동 판정은 말투가 아니라 셀 수 있는 사실의 유무로 쓴다. 발동 문장과 무효화 문장을 한 쌍으로 넣는다"
  - "실행 기록을 근거로 인정하되 이 스킬 안에서만이라는 한정을 같은 줄에 붙인다. 공통 검증 규범 파일은 건드리지 않는다"
  - "전문가 발언을 하위 에이전트로 돌리면 언어 규범과 발언 생산 규격 펜스를 프롬프트에 통째로 복제한다"
  - "설계 문서는 dev-workflow 카테고리 아래에 놓는다"

non_goals:
  - "superpowers 디버깅 네 단계를 고치거나 대체하는 일"
  - "원인을 지목하거나 수정안을 내놓는 일"
  - "좁히기 결과를 오래 남는 파일로 남기는 일"
  - "개발 단계 안에서 발견되는 결함을 처리하는 일 — 기존 이슈 카드 경로가 담당한다"
  - "기존 기능에 새 기능을 붙이거나 사양을 바꾸는 요청을 처리하는 일 — 되돌아가는 문으로 브레인스토밍에 넘긴다"
  - "디버깅 전용 전문가 세트를 새로 만드는 일"
  - "아키텍처를 바꿔야 할 만큼 큰 결함을 이 구간에서 처리하는 일"
  - "superpowers가 내놓은 수정안이 타당한지 다시 따지는 일 — 다음 기능 후보로 이름만 남긴다"
  - "되돌아가는 문 두 개를 자동으로 갈라주는 장치를 만드는 일"
  - "고친 뒤의 커밋과 코드 리뷰 절차"
  - "어휘 감지 훅 배선을 새로 만드는 일"
  - "공통 검증 규범의 출처 3종을 확장하는 일"
  - "전문가 세트 파일이 없을 때의 갈래를 설계하는 일"
  - "조사 중 발견된 별개 문제 두 건 — superpowers 버전 표기 어긋남과 스킬 폴더의 비규범 파일 혼입. 별도 작업으로 이름만 남긴다"

success_criteria:
  - "발동 판정: 에러 원문·재현 절차·바뀐 지점 셋 중 신고에 들어 있는 것이 0~1개면 좁히기가 열리고 2개 이상이면 열리지 않는다. 좁히기 시작 고지 한 줄의 있고 없음으로 센다"
  - "무효화: 원인이 적혀 있거나 파일·함수가 지목된 요청에서는 좁히기 없이 superpowers 디버깅으로 넘어간다"
  - "개발 중 비발동: 열린 계획의 태스크 범위 안 결함은 이슈 카드 경로로 가고, 범위 밖 결함은 좁히기가 열린다"
  - "첫 줄 점검: 탈출 문구·최대 개수 표시·도중 종료 가능 고지 세 가지가 모두 있다"
  - "모름 통과: 모른다고 답하면 다음 질문이나 종료 줄이 나오고 같은 질문이 다시 나오지 않는다"
  - "탈출: 그냥 고쳐라고 답하면 종료 줄 이후 질문이 없고 산출물이 비어 있다"
  - "조기 종료: 모름이 두 번 이어지면 조사 우선순위에 옮겨진 항목이 하나 이상 있고, 물음표 문장이 아니라 무엇을 어디서 확인하라 형태다"
  - "빈손 통과: 새로 얻은 사실이 0개면 산출물 없이 넘어가고 그 사실이 한 줄로 알려진다"
  - "되묻기: 사용자가 말한 증상이 사실이 아닐 가능성을 직접 겨냥한 질문이 최소 한 개 나온다. 더 자세히 묻는 질문은 세지 않는다"
  - "산출물 형태: 조사 우선순위 항목이 전부 확인하라 또는 보라로 끝난다"
  - "산출물 내용: 어느 항목도 왜 그런지에 대한 답을 미리 담고 있지 않다"
  - "복귀 문장이 함께 붙어 있다"
  - "전달: 호출 문장 본문에 내용 그대로 실려 있고, 항목 이름이 superpowers 1단계의 세 가지와 같으며, 사용자 답변과 코드 확인이 태그로 갈라져 있고, 1단계 재현 확인과 최근 변경 조사를 그대로 수행하라가 들어 있다"
  - "완주율: 발동 10회 중 산출물까지 간 횟수가 3회 미만이면 발동 규칙을 되돌린다"
  - "재모집 항목 수: 넘긴 세 항목이 3회 연속으로 모두 재모집되면 전달 방식을 다시 설계한다"
  - "범위 밖 원인: superpowers가 좁힌 범위 밖에서 원인을 찾으면 한 줄 남고, 연속 3회면 산출물 전달을 되돌린다"
  - "파일 없음: superpowers 호출 직전 시점에 좁히기 때문에 늘어난 파일이 0개다. 압축 직전 증상 명세 재출력이 실제로 일어난다"
  - "문서 반영: 규범 충돌 정리 다섯 문장이 지정된 파일에 문구 검색으로 확인된다"
  - "스윕 0건: bootstrap 12행의 옛 문구와 같은 뜻의 문장이 저장소 어디에도 옛 형태로 남아 있지 않다"
  - "비판: 세트가 있으면 이모지 발언 두 명분과 반박 한 건, 병렬 시 대기 고지, 하위 에이전트 시 펜스 복제가 확인된다. 세트가 없으면 비판 관련 출력이 하나도 나오지 않는다"
  - "되돌아가는 문: 두 문의 판정 문장과 도착지가 문서에 있고, 지정된 예시 상황에서 안내 줄이 나온다"
  - "슬래시 명령으로도 같은 구간이 열린다"

assumptions:
  - "사용자가 코드베이스를 어느 정도 알 때 질문이 값을 낸다. 전혀 모르면 지금과 같아지지만 손해는 아니다"
  - "프로젝트 고정 전문가 세트가 디버깅 상황의 비판에도 쓸 만하다"
  - "좁힌 결과를 기록하지 않아도 세션이 끊겼을 때 큰 손실이 없다"
  - "[확인됨] 좁히기가 모으는 정보는 superpowers 1단계가 먼저 요구하는 세 가지와 겹친다"
  - "[확인 못 함] 그래서 1단계 조사가 실제로 짧아지는지는 확인되지 않았다. 완성 판정 기준 15번(재모집 항목 수)이 이것을 관측한다"
  - "[확인됨] 하위 에이전트는 격리된 컨텍스트에서 시작해 대화 기록과 이미 불러온 스킬을 보지 못한다"
  - "[확인 못 함] 세션 시작 훅과 사용자 입력 훅이 하위 에이전트 안에서도 도는지는 공식 문서에 명시가 없다. 개발 단계 작업자에 이 구간이 걸리지 않는다는 경계 판단은 이 미확인 위에 서 있다"
  - "superpowers 디버깅 문서 구조가 당분간 지금 모습을 유지한다. 줄 번호에 기대지 않고 1단계 진입 전이라는 위치로만 붙인다"

open_questions:
  - "첫 화면의 모습 — 질문부터 낼지, 모델이 추론한 재현 경로를 먼저 한 줄 보이고 틀린 곳만 짚게 할지 (구현 중 관찰로 결정)"
  - "질문 개수 상한 — 실제로 몇 개째에서 지치는지 보고 정한다 (구현 중 관찰로 결정)"
  - "비판의 규모 — 몇 명이 몇 라운드로 돌릴지, 서로의 발언을 가릴지 (구현 중 관찰로 결정)"
  - "모름 처리 — 그대로 superpowers에 넘긴다를 기본값으로 시작한다 (구현 중 관찰로 결정)"
  - "원인이 분명하다의 판정선 — 개수 판정을 기본값으로 시작해 실제 신고를 넣어 보며 다듬는다 (구현 중 관찰로 결정)"

context: |
  기존 기능의 결함을 고칠 때 superpowers 디버깅이 호출되고 곧바로 코드가 나오는 현상이 있었다.
  사용자의 불만은 느리다가 아니라 "즉각적으로 나온 해답이 정말 상황을 면밀히 검토한 후 내린 해답인지 알 수가 없다"였다.

  조사 결과 원인은 세 겹이었다. dev-workflow 발동 어휘에 결함 계열이 없고(bootstrap.md 8행),
  12행이 단순 수정과 조사를 워크플로우 밖으로 밀어내며, 이슈 카드는 개발 진입 후에만 작동하고,
  플러그인 자체 원칙(development-principles 42행)이 즉시 수정을 장려한다.

  한편 superpowers 절차 자체는 문제가 아니었다. systematic-debugging 6.2.0은 네 단계로 잘 짜여 있고
  17행에 근본 원인 조사 없이는 수정 금지라는 철칙까지 있다. 빠진 것은 절차가 아니라
  그 절차 안에 사람에게 묻는 자리가 없다는 것이다. 1단계와 2단계 전체에 사용자 질문 절차가 없어
  모델이 혼자 조사한 것과 혼자 추측한 것이 밖에서는 똑같이 보인다.

  사용자가 직접 정리한 뼈대:
  "실제 디버깅 기능은 superpowers가 그대로 담당한다. 왜냐하면 확인된 결과 탄탄하게 구성되어 있기 때문이다.
  다만 superpowers에 결함 및 디버깅을 위한 내용이 전달될때 구체적이지 않을 수 있으므로
  이 경우 파악 범위를 좁히기 위해 간단한 브레인스토밍을 진행한다.
  즉, superpowers 디버깅 진입 전 단계를 만들어준다. 이건 일회성이므로 어딘가에 기록하지 않는다."
