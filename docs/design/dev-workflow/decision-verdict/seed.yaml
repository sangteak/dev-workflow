action: spec-change
feature: decision-verdict
category: dev-workflow

goal: "결정을 물을 때 답을 이미 아는 자리에서는 메뉴를 늘어놓지 않고 모델이 내린 판정과 근거를 먼저 보인 뒤 틀린 곳만 짚게 하고, 메뉴로 남는 자리의 선택지 이름에는 이번 요청의 대상을 붙인다"

constraints:
  # 갈림
  - "문서에 적는 갈림 기준은 「근거를 댈 수 있나」다 — 근거를 댈 수 있으면 판정형, 못 대면 메뉴형"
  - "실행 시점 집행은 「내보내기 전 검사」가 아니라 조립 전 조건이다 (PLAN 정정) — 「판정형으로 박힌 자리인데 확인된 사실 칸에 확인 태그가 한 줄도 없으면 메뉴형으로 조립한다」. 검사는 조립 뒤에 도는 관문이라 조립 자체를 바꾸는 갈림을 거기 걸면 재작성이 된다"
  - "두 화면에 태그 붙은 칸을 먼저 만든 뒤 이 조건을 넣는다 (PLAN 신설) — 순서를 뒤집으면 판정형 대상 둘이 둘 다 메뉴형으로 떨어진다"
  - "판정형은 근거를 댈 수 있을 때만 쓴다 — 근거 없이 판정 모양만 쓰면 메뉴형보다 나쁘다"
  - "되돌리기 판정은 실행할 때마다 매기지 않는다 — 다섯 자리에 지금 한 번씩 박아 넣는다 (국면 3 정정: 여섯에서 다섯으로, Ambiguous 단계 감지 제외)"
  - "무게를 화면 모양으로 나누지 않는다"

  # 화면 모양
  - "성격 승인에서는 근거를 저장소에서 확인해 만든다. 확인하고도 판단이 안 서면 메뉴형으로 떨어진다"
  - "「고칠 게 있다」는 근거를 다시 보이고 자유 응답만 받는다 — 갈래 이름 목록을 붙이지 않는다"
  - "판정이 두 번 틀리면 그 자리에서 메뉴형으로 넘어간다 — 이유가 아니라 지시 문장으로 적는다 (국면 3 신설). 횟수 상한은 신설하지 않는다"
  - "되묻기는 재질문이 아니라 같은 결정의 판정 갱신이다 — 한 줄로 구분해 기존 재질문 금지 조항과 부딪히지 않게 한다"
  - "판정형 화면마다 「그대로 진행을 고르면 무엇이 만들어지는가」를 한 줄로 보인다 (국면 3 신설)"
  - "성격 승인 화면에 읽기 실패 폴백을 한 줄 넣는다 (국면 3 신설) — 판정형 전환이 actions.md 의존을 키운다"

  # 대상 규칙 (국면 3 신설 — 사용자 결정으로 이번 범위에 들어옴)
  - "선택지 이름에는 이번 요청의 대상이 들어간다 — 「새 기능 만들기」가 아니라 「매칭 진입 경로 새로 만들기」. 이미 있는 낱말 검사와 같은 자리에서 센다"
  - "대조 상대를 지정한다 (PLAN 신설) — 「선택지 이름에 이 박스의 문제 칸이나 확인된 사실 칸에 나온 명사가 하나 이상 들어 있는가」. 지정하지 않으면 뜻 판정이 되어 주관 술어 금지와 부딪힌다"
  - "이번 범위는 두 화면이다 (PLAN 축소) — 성격 승인과 Ambiguous 단계 감지. 나머지 여섯 자리는 비목표"

  # 설명 블록
  - "설명은 이름표 없는 짧은 문단이다. 왜·무엇을·어떻게·언제는 담을 내용의 점검표이지 화면 모양이 아니다"
  - "이름표를 떼면 분량 상한이 함께 사라진다. 되찾지 않는다 (PLAN 철회) — 되찾으려던 문장이 뜻 판정이라 주관 술어 금지와 부딪힌다. 상한 없이 가고 관측 항목으로 남긴다"

  # 적용 범위와 정합
  - "로컬 템플릿 면제를 네 자리 전부에서 반으로 쪼갠다 (PLAN 확대: decision-flow.md:178·:276·:292 · grounding.md:25) — 설명 블록 요구만 면제 유지, 결과 줄 규칙과 대상 규칙은 로컬 템플릿에도 건다"
  - "판정형을 일반 결정 박스의 기본 모양으로 승격시키지 않는다 — 다섯 자리에만 적용하고 일반 규범에는 갈림 기준만 적는다"
  - "원본과 사본을 한 번에 고친다 — 재서술 지점 아홉 자리"
  - "재서술 지점 목록을 decision-flow.md 머리말에 박는다 (PLAN 신설) — actions.md:8과 같은 모양. 목록은 바닥이지 천장이 아니며 스윕은 매번 새로 돈다"
  - "그것을 금지하는 development-principles/SKILL.md:150을 교체한다 (PLAN 신설) — 안 바꾸면 규범 둘이 반대말을 한다"
  - "actions.md의 갈래 정의는 안 건드리되, 소비 계약의 적용 경로 목록은 정합 대상이다 (국면 3 확정)"
  - "도메인 문서(ux-consistency.md)는 이번 스윕 대상이 아니다 — merge-to-domain 담당"
  - "스킬 문서를 검사하는 자동 시험이 없다 — 검증은 문자열 스윕과 실물 화면 재현으로 한다"
  - "언어 규범 펜스는 그대로 유지한다"

non_goals:
  - "확인 지점 자체를 없애거나 개수를 줄이기 — 최초 요구가 사는 층위지만 사용자 결정으로 별도 작업으로 미뤘다"
  - "Ambiguous 단계 감지를 판정형으로 바꾸기 (국면 3 신설) — 이 화면은 단계가 불명확할 때만 켜져 근거 부재가 곧 발동 조건이다"
  - "actions.md의 갈래 정의 바꾸기 — 판정형 전환으로 빈 종료 조건 칸이 화면에 나올 경로가 사라졌다"
  - "결정의 무게를 매겨 화면을 등급별로 나누기"
  - "멀쩡하게 도는 로컬 템플릿 다섯 손대기"
  - "Yes/No 승인 게이트 둘(시드 확인·단계 확인)"
  - "낱말 검사가 일상 관형사에 발화하는 문제 자체 고치기"
  - "판정형을 일반 결정 박스의 기본 모양으로 승격시키기"
  - "대상 규칙을 나머지 여섯 자리에 걸기 (PLAN 결정) — 재논의 대기열·merge-to-domain 실행 모드·setup 안내·Simplifier 스코프 정리·카테고리 선택·미답변 조사 여부·이슈 카드 잔존. 문제 보고가 없고, 범위를 다 열고 세다가 놓치는 실패를 두 번 겪었다"
  - "설명 블록의 분량 상한 되찾기 (PLAN 철회) — 되찾으려던 문장이 뜻 판정이라 주관 술어 금지와 부딪힌다"

success_criteria:
  - "갈림 기준이 decision-flow에 들어가고, 다섯 자리(성격 승인·재협의 선택지·Ambiguous 단계 감지·재논의 대기열·일반 결정 박스)에 판정형인지 메뉴형인지가 문서에 박혀 있다 — 실행 시점에 매기는 자리가 0곳"
  - "설명 블록 규정이 문단형으로 바뀌고 '이름표 붙은 네 항목'을 요구하는 문장이 원본과 사본 전부에서 0건 (실측 인벤토리 7곳)"
  - "결과 줄 규칙이 통과 검사로 되돌아오고, 「적용 밖」 ①이 설명 블록 요구에만 걸린다"
  - "REQ-006이 메뉴형으로 박은 세 자리(Ambiguous 단계 감지·재논의 대기열·일반 결정 박스)의 '고르면:' 줄이 사용자가 겪는 차이를 말한다 — 목록이 요구사항 안에 있어 검증 시점에 다시 세지 않는다"
  - "성격 승인과 Ambiguous 단계 감지의 선택지 이름에 이번 요청의 대상이 들어 있다 — 「내보내기 전 검사」 두 번째 항목으로, 박스의 문제 칸·확인된 사실 칸과 대조해 세어진다"
  - "「고칠 게 있다」 경로에 갈래 이름 목록이 0건"
  - "성격 승인에 저장소 근거 칸이 있고, 확인 실패 시 메뉴형으로 떨어지는 길이 문서에 있다"
  - "판정이 두 번 틀리면 메뉴형으로 넘어간다는 지시 문장이 문서에 있다"
  - "재서술 지점 목록이 decision-flow.md 머리말에 있고, 그 아홉 자리가 함께 갱신되어 어느 것을 읽어도 같은 모양이 나온다"
  - "development-principles/SKILL.md:150이 목록을 허용하는 문장으로 바뀌어 있다"
  - "실물 판정 — 고르지 못했던 「어떤 일인지 정하기」 화면을 새 규범으로 다시 그렸을 때 사용자가 고를 수 있다고 답한다. 자유 응답 경로(「고칠 게 있다」 → 갈래로 옮김 → 재확인)도 표본에 포함한다"

assumptions:
  - "[국면 3 검증 — 위험 낮음] 짧은 문단이 이름표 넷보다 읽기 쉽다. 참조 도구의 확인 화면 규격도 '몇 개의 짧은 문단'이고, 틀렸을 때 잃는 것이 작다 (셀 것을 근거 태그로 옮겨 뒀다)"
  - "[국면 3 검증 — 위험 중간] 자유 입력을 모델이 갈래로 옮길 수 있다. 메뉴형에서도 이미 벌어지던 일이고, 두 번 틀리면 메뉴형으로 떨어지는 지시가 회수 장치다"
  - "[국면 3 검증 — 위험 낮음] 판정형이 메뉴형보다 낫다. 사례 하나가 아니다 — 설치 규모가 큰 도구 둘이 같은 자리에서 판정형을 쓴다. 다만 그 둘도 답이 열린 자리에서는 메뉴를 낸다"
  - "[국면 3 검증 — 위험 중간] 동의 편향을 되돌릴 수 있는 지점에서 감수한다. 성격 승인은 되돌리기가 파일 되돌리기라 다섯 자리 중 비용이 가장 크다 — 「무엇이 만들어지는가」 한 줄이 비용을 보이게 한다"
  - "로컬 템플릿 열 곳 전수 조사에서 결함이 셋뿐이라는 결과가 정확하다"
  - "[반박 수용] 하중을 견디는 것은 「근거를 댈 수 있을 때만」이고 나머지는 장식에 가깝다 (비판 담당)"
  - "[국면 3 반증] 사용자가 못 고른 원인이 판정과 근거의 부재라는 전제는 틀렸다. 복원된 실물 화면에 판정과 확인 근거가 이미 붙어 있었다 — 없던 것은 선택지 이름에 붙은 대상이다"

open_questions: []

context: |
  발단은 1.24.0을 로컬에 적용한 직후다. 사용자가 다른 프로젝트에서 「어떤 일인지 정하기」
  화면을 받았는데 고를 수 없었다 — "도대체 뭐에 대한 새기능이고 뭐에 대한 코드 다듬기 인지를
  알수가 없다니까."

  그 화면은 로컬 템플릿이라 1.24.0이 만든 설명 블록의 「적용 밖」 ①에 명시적으로 빠져 있었다.
  1.24.0의 최종 리뷰가 이 위험을 적어 뒀고 설계 문서 9장에 실려 있었는데, 첫 사용에서
  실측으로 돌아왔다.

  국면 2를 마친 뒤 대화가 세 입장 사이를 오갔다 — 설명을 더 붙이기, 판정을 앞에 놓기,
  화면을 없애기. 매번 사용자가 되밀었다. 전면 재점검(조사 6·판정 4·인용 대조 1)으로
  원인이 규범 충돌이 아니라 국면 1 스냅샷이 커밋되지 않아 매번 유실된 것임을 확인했고,
  국면 3 진입과 함께 커밋했다.

  같은 재점검이 실물 화면 원문을 복원해 두 가지를 밝혔다. 그 화면에는 이미 판정과 저장소
  근거가 붙어 있었다는 것, 그리고 결과 줄의 원천이 actions.md의 빈 종료 조건 칸이라는 것이다.
  앞의 것이 이 설계의 하중을 「선택지 이름에 대상이 들어 있나」로 옮겼고, 뒤의 것은 판정형
  전환으로 화면 경로가 사라져 비목표를 열지 않고 해소됐다.
